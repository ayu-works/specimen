name: CI
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; keep the token read-only.
permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # T6.07 scans the whole history; a shallow clone fails the scan
          persist-credentials: false # dependencies and tests run below; they don't need the token
      # Pinned gitleaks for `pnpm secrets` (T6.07), checked against its release sha256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The promo video (Remotion) isn't part of the gate; skip installing it.
      - run: pnpm i --frozen-lockfile --filter '!@specimen/video'
      - id: pw
        run: echo "version=$(pnpm -F @specimen/extension exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -F @specimen/extension exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -F @specimen/extension exec playwright install-deps chromium
      - run: xvfb-run --auto-servernum pnpm gate

  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip unless apps/video changed
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --quiet "$base" HEAD -- apps/video pnpm-lock.yaml 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm i --frozen-lockfile --filter @specimen/video
      - if: steps.changed.outputs.run == 'true'
        run: pnpm typecheck:video
      - if: steps.changed.outputs.run == 'true'
        run: pnpm test:video
