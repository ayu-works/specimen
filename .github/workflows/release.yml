name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm zip
      - name: Check the manifest
        run: |
          node -e "
          const m = JSON.parse(require('fs').readFileSync('apps/extension/.output/chrome-mv3/manifest.json', 'utf8'));
          const bad = [];
          if (m.host_permissions && m.host_permissions.length) bad.push('host_permissions: ' + m.host_permissions.join(', '));
          if ((m.permissions || []).includes('debugger')) bad.push('required debugger permission');
          if (bad.length) { console.error('Manifest check failed: ' + bad.join('; ')); process.exit(1); }
          console.log('Manifest OK');
          "
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/extension/.output/*-chrome.zip --generate-notes
