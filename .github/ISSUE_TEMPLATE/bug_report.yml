name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste API keys** or other secrets. For security issues, use the private report link in the SECURITY policy instead.
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: From chrome://version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Specimen version
      description: From chrome://extensions
  - type: input
    id: url
    attributes:
      label: URL you scanned
      description: Only if the site is public.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Add a screenshot or the error text if you can.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider and model
      description: Only if the bug involves an AI feature (for example local Gemma 1B, Groq, Claude). Leave empty otherwise.
