# Netlify publishes the website in site/. There is no build step: what's in the folder is what goes live.
[build]
  base = "site"
  publish = "."
  command = ""
  # Skip the deploy when nothing in site/ changed (extension-only commits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Short links.
[[redirects]]
  from = "/install"
  to = "https://chromewebstore.google.com/detail/pbolkplggojhilegibocfkaeonjakkgp"
  status = 302

[[redirects]]
  from = "/github"
  to = "https://github.com/ayu-works/specimen"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src 'self' only so Lighthouse's robots.txt check (T7.02) can run; the pages make no requests themselves.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
